version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: perfil-user-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: perfil_user_db
      MYSQL_USER: perfil_user
      MYSQL_PASSWORD: userpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - perfil-user-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: perfil-user-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - perfil-user-network

volumes:
  mysql_data:

networks:
  perfil-user-network:
    driver: bridge 